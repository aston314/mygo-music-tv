name: Sync plugin catalog
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-plugin-catalog
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch and validate upstream directory
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/sync_plugin_catalog.py
      - name: Commit verified catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin-catalog.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh public plugin catalog'
          git pull --rebase origin main
          git push origin HEAD:main
