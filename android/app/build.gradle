plugins { id 'com.android.application' }
def product = new groovy.json.JsonSlurper().parse(file('../../app.json'))
def releaseKeystore = System.getenv('ANDROID_KEYSTORE_PATH')
android {
    namespace product.applicationId
    compileSdk 35
    defaultConfig {
        applicationId product.applicationId
        minSdk product.minSdk
        targetSdk 35
        versionCode product.versionCode
        versionName product.versionName
        resValue 'string', 'app_name', product.displayName
        buildConfigField 'String', 'UPDATE_REPOSITORY', groovy.json.JsonOutput.toJson(product.publicReleaseRepository ?: '')
        buildConfigField 'String', 'UPDATE_MANIFEST_URL', groovy.json.JsonOutput.toJson(product.updateManifestUrl ?: '')
        buildConfigField 'boolean', 'UPDATE_ENABLED', (product.appUpdatesEnabled == true).toString()
        ndk { abiFilters.addAll(product.abis) }
        manifestPlaceholders = [appName: product.displayName]
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            if (releaseKeystore) signingConfig signingConfigs.release
        }
    }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += '**/libmygocore.so' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-session:1.6.1'
    testImplementation 'junit:junit:4.13.2'
}
