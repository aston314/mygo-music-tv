<!doctype html>
<html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Music+</title><script src="/platform.js"></script><link rel="icon" type="image/svg+xml" href="/brand/ic_launcher_round.svg"><link rel="stylesheet" href="/app.css"><script src="/locales/zh-CN.js"></script><script src="/locales/zh-TW.js"></script><script src="/i18n.js"></script></head>
<body><div id="stage">
  <div id="startup"><div class="startup-logo"><div class="ring"></div><span class="startup-icon"><svg class="icon" viewBox="0 0 108 108" aria-hidden="true" focusable="false">
<circle cx="54" cy="54" r="54" fill="#E5324B" stroke="none" />
<g transform="translate(54 54) scale(.95) translate(-54 -54) translate(-3.4 5.4)" fill="#FFFFFF" stroke="none"><circle cx="38" cy="70" r="12" /><rect x="43" y="28" width="7" height="42" rx="3.5" /><path d="M59 32H85M72 19V45" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" fill="none" /></g>
</svg></span></div><p id="startup-status" data-i18n="正在启动 My Music+…">正在启动 My Music+…</p><small id="startup-version"></small><button id="startup-retry" hidden data-i18n="重试">重试</button></div>
  <div id="app" hidden>
    <aside id="sidebar"><div class="brand"><span class="brand-mark"><svg class="icon brand-icon" viewBox="18 18 72 72" aria-hidden="true" focusable="false">
<g transform="translate(54 54) scale(.95) translate(-54 -54) translate(-3.4 5.4)" fill="currentColor" stroke="none"><circle cx="38" cy="70" r="12" /><rect x="43" y="28" width="7" height="42" rx="3.5" /><path d="M59 32H85M72 19V45" stroke="currentColor" stroke-width="7.5" stroke-linecap="round" fill="none" /></g>
</svg></span><div class="brand-name">My Music+</div></div>
      <button id="source-switch" class="source-switch" data-focus="source-switch" aria-label="切换音乐源"><span class="button-content"><span class="source-dot"></span><span class="source-icon" data-icon="sources"></span><span id="source-name">选择音乐源</span><span class="source-chevron" data-icon="chevronDown"></span></span></button>
      <nav id="nav" aria-label="主导航" data-i18n-aria-label="主导航"></nav>
    </aside>
    <main><header><div class="page-heading"><span id="eyebrow">My Music+</span><h1 id="page-title">发现音乐</h1></div><div class="header-tools"><div id="header-actions"></div><button id="account-button" data-focus="account" data-action="account" hidden><span class="button-content"><span data-icon="artist"></span><span id="account-name">账号</span></span></button></div></header><div id="content" class="scroll"></div></main>
    <footer id="player-bar" aria-label="播放控制" data-i18n-aria-label="播放控制">
      <button class="now-cover" data-focus="now" id="open-player" aria-label="打开播放与歌词" data-i18n-aria-label="打开播放与歌词"><span data-icon="music"></span></button>
      <div class="now-meta"><strong id="now-title">音乐，即将响起</strong><button id="now-artist" class="credit-link" data-focus="now-artist" data-action="now-artist" disabled>选择音乐，开始聆听</button><button id="now-album" class="credit-link" data-focus="now-album" data-action="now-album" hidden></button></div>
      <button class="icon-button" id="now-like" data-focus="now-like" data-action="now-like" data-like-label="no" aria-label="喜欢这首歌" aria-pressed="false" hidden><span class="button-content" data-icon="heart"></span></button>
      <div class="transport"><button class="icon-button" data-focus="previous" id="previous" aria-label="上一首" data-i18n-aria-label="上一首"><span class="button-content" data-icon="previous"></span></button><button class="play-button icon-button" data-focus="toggle" id="toggle" aria-label="播放"><span class="button-content" data-icon="play"></span></button><button class="icon-button" data-focus="next" id="next" aria-label="下一首" data-i18n-aria-label="下一首"><span class="button-content" data-icon="next"></span></button></div>
      <div class="timeline"><span id="playback-status" role="status"></span><div class="timeline-controls"><span id="position">0:00</span><button data-focus="seek" id="seek" role="slider" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-label="播放进度，左右键快退或快进，上下键切换控件" data-i18n-aria-label="播放进度，左右键快退或快进，上下键切换控件" disabled><span class="progress-track"><i id="progress"><b class="progress-thumb"></b></i></span></button><span id="duration">0:00</span></div></div>
      <button class="icon-button" id="mode-button" data-focus="mode" data-action="play-mode" aria-label="播放模式"><span class="button-content" data-icon="sequence"></span></button>
      <button class="icon-button" data-focus="queue" id="queue-button" aria-label="播放队列" data-i18n-aria-label="播放队列"><span class="button-content" data-icon="queue"></span></button>
      <button class="icon-button" hidden id="lyrics-button" data-focus="full-lyrics" data-action="full-lyrics" aria-label="全屏歌词" aria-pressed="false" title="全屏歌词" disabled><span class="button-content" data-icon="fullscreen"></span></button>
    </footer>
  </div><div id="modal-layer" hidden></div><div id="toast" role="status" hidden></div><audio id="audio" preload="metadata"></audio>
</div><script src="/scan-input.js"></script><script src="/app.js"></script></body></html>
