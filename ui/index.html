<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MyGo Music TV</title><link rel="stylesheet" href="/app.css"></head>
<body><div id="stage">
  <div id="startup"><div class="startup-logo"><div class="ring"></div><span>♪</span></div><p id="startup-status">正在启动 MyGo Music TV…</p><small>版本 0.1.0</small><button id="startup-retry" hidden>重试</button></div>
  <div id="app" hidden>
    <aside id="sidebar"><div class="brand"><span class="brand-mark">♪</span><div class="brand-name">MyGo<span>MUSIC / TV</span></div></div>
      <button id="source-switch" class="source-switch" data-focus="source-switch"><span class="source-dot"></span><span id="source-name">选择音乐源</span><span>⌄</span></button>
      <div class="nav-label">你的音乐空间</div><nav id="nav"></nav><div class="sidebar-footer"><span class="live-dot"></span><span>让音乐，充满房间</span></div>
    </aside>
    <main><header><div><span id="eyebrow">MYGO MUSIC</span><h1 id="page-title">发现音乐</h1></div><div id="header-actions"></div></header><div id="content" class="scroll"></div></main>
    <footer id="player-bar"><button class="now-cover" data-focus="now" id="open-player">♪</button><div class="now-meta"><strong id="now-title">音乐，即将响起</strong><span id="now-artist">选择喜欢的音乐源，开启聆听</span></div><div class="transport"><button data-focus="previous" id="previous" aria-label="上一首">⏮</button><button class="play-button" data-focus="toggle" id="toggle" aria-label="播放或暂停">▶</button><button data-focus="next" id="next" aria-label="下一首">⏭</button></div><div class="timeline"><span id="position">0:00</span><button data-focus="seek" id="seek" aria-label="快进十秒"><i id="progress"></i></button><span id="duration">0:00</span></div><button data-focus="queue" id="queue-button">≡ 队列</button></footer>
  </div><div id="modal-layer" hidden></div><div id="toast" role="status" hidden></div><audio id="audio" preload="metadata"></audio>
</div><script src="/app.js"></script></body></html>
