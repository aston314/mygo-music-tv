name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/validate_tv_app.py
      - run: go test -mod=vendor -race ./core/internal/...
      - run: node --check ui/app.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - run: bash scripts/build_android_binaries.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android testDebugUnitTest lintDebug assembleDebug
      - name: Verify all core ABIs are packaged
        run: python3 scripts/verify_apk.py android/app/build/outputs/apk/debug/app-debug.apk
      # APKs remain CI scratch files; formal releases use a separate signed workflow.
