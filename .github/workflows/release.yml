name: Android Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      prerelease:
        description: '标记为电视测试版'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate release and signing inputs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/android_release.py preflight
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check core and preview
        run: |
          python3 scripts/validate_tv_app.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          go test -mod=vendor -race ./core/internal/... ./core/cmd/plugin-audit
          npm run check
          npm ci
          npx playwright install chromium
          npm test
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '16111833'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - run: bash scripts/build_android_binaries.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android testDebugUnitTest lintRelease assembleRelease
      - name: Verify signed APK and prepare release files
        run: python3 scripts/android_release.py package --apk android/app/build/outputs/apk/release/app-release.apk
      - name: Publish verified private release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref_name, '-') }}
        run: |
          release_flags=()
          if [ "$RELEASE_PRERELEASE" = "true" ]; then release_flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "$RELEASE_APK" build/release/update.json build/release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MyGo Music TV $RELEASE_TAG" --notes-file "$RELEASE_NOTES" "${release_flags[@]}"
      - name: Mirror verified public downloads
        if: vars.MYGO_PUBLIC_RELEASES_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ secrets.MYGO_RELEASES_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo 'MYGO_RELEASES_TOKEN is required for public downloads'; exit 1; }
          python3 scripts/publish_public_release.py --directory build/release --notes "$RELEASE_NOTES"
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/mygo-release-keystore.jks"
