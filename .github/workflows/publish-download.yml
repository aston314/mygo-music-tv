name: Publish signed download
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已完成私有签名 Release 的标签，例如 v0.1.4'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: mygo-public-downloads
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch existing signed files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.-]+)?$ ]]
          git merge-base --is-ancestor "$RELEASE_TAG" origin/main
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir build/release --pattern '*.apk' --pattern update.json --pattern SHA256SUMS.txt
          python3 scripts/publish_public_release.py --directory build/release --notes build/release/notes.md --verify-only
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('build/release')
          manifest = json.loads((root / 'update.json').read_text())
          assert 'v' + manifest['version_name'] == os.environ['RELEASE_TAG']
          (root / 'notes.md').write_text(manifest.get('release_notes', ''))
          PY
      - name: Publish verified files without rebuilding
        env:
          GH_TOKEN: ${{ secrets.MYGO_RELEASES_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo 'MYGO_RELEASES_TOKEN is required'; exit 1; }
          python3 scripts/publish_public_release.py --directory build/release --notes build/release/notes.md
